[build]
  command = "node sync-stripe.js"
  publish = "."

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.trysoro.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://app.trysoro.com https://afocirmbqdxnkyescnev.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://buy.stripe.com https://checkout.stripe.com; frame-ancestors 'none';"

# TikTok OAuth callback redirect
[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/tiktok-callback"
  status = 200

# Block crawlers from VIP image paths
[[headers]]
  for = "/images/vip/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
